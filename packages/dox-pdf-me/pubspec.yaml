name: dox_pdf_me
description: Make PDF files from pdfme templates in Dart. A port of the pdfme generator on top of dox_pdf_lib.
version: 0.0.1
repository: https://github.com/dartondox/dox-pdf-lib

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  barcode: ^2.2.9
  characters: ^1.4.1
  # Needs dictionaryWordBreaks, new in dox_pdf_lib 0.0.2. Not ^0.0.2: in
  # 0.0.x that means <0.0.3, so the next dox_pdf_lib release would break
  # `dart pub get` in this workspace.
  dox_pdf_lib: '>=0.0.2 <0.1.0'
  xml: ^7.1.0

dev_dependencies:
  crypto: ^3.0.8
  lints: ^6.1.0
  test: ^1.33.0
