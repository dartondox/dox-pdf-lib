[package]
name = "dox_pdf_lib"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# flate2: compress content streams and images (lopdf uses it too)
flate2 = "1.1.11"
# png: decode PNG images for embedPng
png = "0.18.1"
# rayon: parse the objects of a big file on all cores
lopdf = { version = "0.47.0", default-features = false, features = ["rayon"] }
# harfrust: text layout of custom fonts (a port of HarfBuzz)
harfrust = "0.16.0"
# read-fonts: read the tables of custom fonts (harfrust uses it too)
read-fonts = "0.47.0"
# subsetter: font subsets for embedFont(subset: true), from typst
subsetter = { version = "0.2.6", default-features = false }
# unicode-bidi: the order of right-to-left and left-to-right runs (UAX #9)
unicode-bidi = "0.3.18"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# unwind, not abort: every export catches a panic (catch_unwind) and returns
# an error, so a bad PDF can not end the process
panic = "unwind"
strip = true
