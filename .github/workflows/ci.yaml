name: CI

# Every push to main and every pull request: format and analyze of all
# packages, then the tests of each package. dox_pdf_lib also runs the Rust
# checks and the pdf-lib crosscheck; dox_pdf_me runs the pdfme crosscheck. Every PR builds the 5 native targets
# of dox_pdf_lib.
#
# The Release workflow (release.yaml) runs this workflow first on a tag.
# With `build: true` it also builds the 5 targets for the release.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
  workflow_call:
    inputs:
      build:
        description: Build the 5 native targets of dox_pdf_lib
        type: boolean
        default: false

permissions:
  contents: read

env:
  # the oldest glibc that the Linux libraries load on
  GLIBC: "2.34"

jobs:
  # Pub workspace: one `dart pub get` at the root links all packages.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: stable
      - name: Dart checks
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos .

  # also on a release tag: a red test stops the build, the release and the publish
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/dox-pdf-lib/native
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: stable
      # pdf-lib (Node.js) for the crosscheck test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      # the library for the Dart tests is built by the Dart build hook
      # (cargo, in its own target folder), so there is no build step here
      - name: Rust checks
        working-directory: packages/dox-pdf-lib/native
        run: |
          cargo fmt --check
          cargo clippy --release --all-targets -- -D warnings
          cargo test --release
      - name: Resolve the workspace
        run: dart pub get
      # THIRD_PARTY_NOTICES must list the crates of native/Cargo.lock
      - name: Check the third party notices
        working-directory: packages/dox-pdf-lib
        run: dart run tool/third_party_notices.dart --check
      - name: Install pdf-lib for the crosscheck
        working-directory: packages/dox-pdf-lib/tool/crosscheck
        run: npm ci
      # pdftoppm renders pages for the drawing and embed crosschecks;
      # pdfdetach lists attachments; pdftotext reads text back; hb-shape
      # (HarfBuzz) for the language matrix (test/language_test.dart)
      - name: Install poppler-utils and hb-shape
        run: sudo apt-get update && sudo apt-get install -y poppler-utils libharfbuzz-bin
      # veraPDF (Java) checks the PDF/A files of test/conformance_test.dart.
      # A fixed version, checked with sha256; a headless install
      - name: Install veraPDF
        run: |
          zip="$RUNNER_TEMP/verapdf.zip"
          curl -sSfL -o "$zip" https://software.verapdf.org/rel/1.30/verapdf-greenfield-1.30.4-installer.zip
          echo "04415ef3f149526a3048b9889723e81320ddf013bd891bcc7f0f297f3eadcc23  $zip" | sha256sum -c -
          unzip -q "$zip" -d "$RUNNER_TEMP/verapdf-installer"
          cat > "$RUNNER_TEMP/verapdf-auto.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
          <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
          <com.izforge.izpack.panels.target.TargetPanel id="install_dir"><installpath>$RUNNER_TEMP/verapdf</installpath></com.izforge.izpack.panels.target.TargetPanel>
          <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
          <pack index="0" name="veraPDF GUI" selected="true"/>
          <pack index="1" name="veraPDF Batch files" selected="true"/>
          <pack index="2" name="veraPDF Validation model" selected="true"/>
          <pack index="3" name="veraPDF Documentation" selected="false"/>
          <pack index="4" name="veraPDF Sample Plugins" selected="false"/>
          </com.izforge.izpack.panels.packs.PacksPanel>
          <com.izforge.izpack.panels.install.InstallPanel id="install"/>
          <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          EOF
          java -jar "$RUNNER_TEMP"/verapdf-installer/verapdf-greenfield-1.30.4/verapdf-izpack-installer-1.30.4.jar "$RUNNER_TEMP/verapdf-auto.xml"
          echo "$RUNNER_TEMP/verapdf" >> "$GITHUB_PATH"
      # the crosscheck and veraPDF must run here, not be skipped
      - name: Dart tests
        working-directory: packages/dox-pdf-lib
        env:
          REQUIRE_VERAPDF: '1'
        run: |
          test -d tool/crosscheck/node_modules/pdf-lib
          command -v pdftoppm
          command -v hb-shape
          command -v verapdf
          dart test --concurrency=4

  test-pdf-me:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # dox_pdf_lib is a workspace package here: its build hook builds the
      # native library from source with cargo
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/dox-pdf-lib/native
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: stable
      # pdfme (Node.js) for the crosscheck test. Node.js 24: its ICU picks
      # the Thai, Lao, Khmer and Myanmar word breaks, and dox_pdf_lib matches
      # that ICU (see tool/crosscheck/word_breaks.mjs)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Resolve the workspace
        run: dart pub get
      - name: Install pdfme for the crosscheck
        working-directory: packages/dox-pdf-me/tool/crosscheck
        run: npm ci
      # pdftoppm renders the pages; zbarimg decodes the 2D codes
      - name: Install poppler-utils and zbar-tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils zbar-tools
      # the crosscheck must run here, not be skipped
      - name: Dart tests
        working-directory: packages/dox-pdf-me
        run: |
          test -d tool/crosscheck/node_modules/@pdfme/generator
          command -v pdftoppm
          command -v zbarimg
          dart test --concurrency=4

  # every PR builds the 5 targets too, so a Windows break shows before a release
  build:
    if: github.event_name == 'pull_request' || inputs.build
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, file: libdox_pdf_lib.dylib, asset: dox_pdf_lib-macos-arm64.dylib }
          - { os: macos-latest, target: x86_64-apple-darwin, file: libdox_pdf_lib.dylib, asset: dox_pdf_lib-macos-x64.dylib }
          # zig: built with `cargo zigbuild` for the glibc floor in `GLIBC`
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, file: libdox_pdf_lib.so, asset: dox_pdf_lib-linux-x64.so, zig: true }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, file: libdox_pdf_lib.so, asset: dox_pdf_lib-linux-arm64.so, zig: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, file: dox_pdf_lib.dll, asset: dox_pdf_lib-windows-x64.dll }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # zig is the linker of the Linux libraries: it links the unwinder into
      # the library, so the library does not need libgcc_s, and it sets the
      # glibc floor
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: matrix.zig
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        if: matrix.zig
        with:
          tool: cargo-zigbuild@0.24.1
      - name: Build
        shell: bash
        working-directory: packages/dox-pdf-lib/native
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release --target "${{ matrix.target }}.$GLIBC"
            ../tool/check_linux_lib.sh target/${{ matrix.target }}/release/${{ matrix.file }} "$GLIBC"
          else
            cargo build --release --target ${{ matrix.target }}
          fi
          mkdir -p ../../../dist
          cp target/${{ matrix.target }}/release/${{ matrix.file }} ../../../dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
