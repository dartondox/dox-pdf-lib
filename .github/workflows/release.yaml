name: Release

# Each package has its own tags: <package>-v<version>, eg.
# dox_pdf_lib-v0.0.2 or dox_pdf_me-v0.0.1. The version must be the one in
# packages/<folder>/pubspec.yaml, and the tag must be on main.
#
# 1. check the tag, then run all CI tests (ci.yaml). A red test stops
#    everything after it.
# dox_pdf_lib only:
# 2. build the library for the 5 targets (in ci.yaml),
# 3. upload them to the GitHub release of the tag, with SHA256SUMS,
# 4. fill `_sha256` in hook/build.dart from SHA256SUMS, publish the package
#    to pub.dev, and push the new hashes to main.
#    The hook downloads these files, so users do not need Rust.
# dox_pdf_me: publish the package to pub.dev (no native build).

on:
  push:
    tags:
      - 'dox_pdf_lib-v*'
      - 'dox_pdf_me-v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  LIB: dox_pdf_lib

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag
        run: |
          package=${GITHUB_REF_NAME%%-v*}
          version=${GITHUB_REF_NAME#*-v}
          pubspec="packages/${package//_/-}/pubspec.yaml"
          # the tag must be on main, so the published code is what main has
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD || { echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1; }
          spec=$(git show "$GITHUB_SHA:$pubspec") || { echo "::error::no $pubspec"; exit 1; }
          v=$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' <<< "$spec")
          [ "$v" = "$version" ] || { echo "::error::tag $GITHUB_REF_NAME, $pubspec has $v"; exit 1; }

  # Read access only. The tests run a lot of other code, so they must not
  # get the pub.dev token.
  test:
    needs: check
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read
    with:
      build: ${{ startsWith(github.ref_name, 'dox_pdf_lib-v') }}

  release:
    if: startsWith(github.ref_name, 'dox_pdf_lib-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          sha256sum "$LIB"-* > SHA256SUMS
          cat SHA256SUMS
          # a version with "-" in it is a prerelease
          pre=()
          case "${TAG#*-v}" in *-*) pre=(--prerelease) ;; esac
          # a re-run replaces the files of the release
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" ./* --clobber --repo "$GITHUB_REPOSITORY"
            # a deleted and pushed again tag leaves the release as a draft
            gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" ./* --repo "$GITHUB_REPOSITORY" ${pre[@]+"${pre[@]}"} \
              --title "$TAG" --notes "Ready-built $LIB libraries. See SHA256SUMS."
          fi

  publish-pdf-lib:
    needs: release
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write # pub.dev automated publishing (OIDC)
      contents: write # push the hashes to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      # the check job made sure the tag is on main
      - run: git checkout "$GITHUB_SHA"
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - name: Fill the hashes
        working-directory: packages/dox-pdf-lib
        run: dart run tool/native_hashes.dart "$GITHUB_REF_NAME"
      - name: Publish to pub.dev
        working-directory: packages/dox-pdf-lib
        run: dart pub publish --force
      - name: Push the hashes to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # no change at all: stash would save nothing and pop would fail
          if git diff --quiet; then
            echo "The hashes did not change."
            exit 0
          fi
          git stash
          git checkout main
          git stash pop
          # a rerun of the same tag: main has these hashes already
          if git diff --quiet; then
            echo "The hashes on main are up to date."
            exit 0
          fi
          git commit -am "Hashes of the $GITHUB_REF_NAME libraries"
          git push origin main

  publish-pdf-me:
    if: startsWith(github.ref_name, 'dox_pdf_me-v')
    needs: test
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write # pub.dev automated publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - name: Publish to pub.dev
        working-directory: packages/dox-pdf-me
        run: dart pub publish --force
